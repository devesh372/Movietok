
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MOVIETOK | Discover Movies</title>

<style>
*{box-sizing:border-box}

body{
 margin:0;
 background:#0d0d12;
 color:white;
 font-family:Arial,sans-serif;
}

header{
 padding:18px 20px;
 background:#17171f;
 display:flex;
 justify-content:space-between;
 align-items:center;
}

.logo{
 color:#ff3155;
 font-size:27px;
 font-weight:bold;
}

.hero{
 padding:45px 20px;
 text-align:center;
 background:linear-gradient(120deg,#46142c,#171727);
}

.search{
 display:flex;
 max-width:550px;
 margin:25px auto;
}

input{
 flex:1;
 min-width:0;
 padding:15px;
 border:0;
 border-radius:8px 0 0 8px;
 font-size:16px;
}

button{
 padding:12px 17px;
 background:#ff3155;
 color:white;
 border:0;
 border-radius:6px;
 cursor:pointer;
}

.search button{border-radius:0 8px 8px 0}

section{padding:20px}

.movies{
 display:grid;
 grid-template-columns:repeat(2,minmax(0,1fr));
 gap:15px;
}

.movie{
 background:#1c1c25;
 border-radius:10px;
 overflow:hidden;
 cursor:pointer;
}

.poster{
 width:100%;
 display:block;
 aspect-ratio:2/3;
 object-fit:cover;
 background:#292933;
}

.movie-info{padding:12px}

.movie h3{
 font-size:15px;
 margin:0 0 8px;
}

.movie p{
 color:#ffc44d;
 font-size:13px;
 margin:5px 0;
}

.status{color:#aaa}

#detailsPage{display:none}

.back-button{
 background:#292933;
 font-size:20px;
 margin-bottom:15px;
}

.backdrop{
 width:100%;
 max-height:400px;
 object-fit:cover;
 border-radius:12px;
}

.details-title{
 font-size:29px;
 margin:15px 0;
}

.details-meta{
 color:#ffc44d;
 line-height:1.8;
}

.overview{
 color:#ccc;
 line-height:1.7;
}

.genre{
 display:inline-block;
 background:#292933;
 padding:8px 12px;
 margin:5px;
 border-radius:20px;
 font-size:13px;
}

.info-grid{
 display:grid;
 grid-template-columns:repeat(2,minmax(0,1fr));
 gap:12px;
 margin:20px 0;
}

.info-box{
 background:#1c1c25;
 padding:13px;
 border-radius:9px;
}

.info-box small{
 display:block;
 color:#aaa;
 margin-bottom:6px;
}

.cast-grid{
 display:grid;
 grid-template-columns:repeat(3,minmax(0,1fr));
 gap:12px;
}

.cast-card{
 background:#1c1c25;
 border-radius:9px;
 overflow:hidden;
}

.cast-card img{
 width:100%;
 aspect-ratio:2/3;
 object-fit:cover;
 display:block;
}

.cast-card p{
 font-size:12px;
 padding:0 8px;
 line-height:1.4;
}

.trailer{
 width:100%;
 aspect-ratio:16/9;
 border:0;
 border-radius:10px;
}

@media(min-width:700px){
 .movies{grid-template-columns:repeat(5,minmax(0,1fr))}
 #detailsPage{max-width:950px;margin:auto}
 .cast-grid{grid-template-columns:repeat(6,minmax(0,1fr))}
}
</style>
</head>

<body>

<header>
 <div class="logo">MOVIETOK</div>
 <div>🎬 Discover</div>
</header>

<div id="homePage">

 <div class="hero">
  <h1>Discover Your Next Movie.</h1>
  <p>Hollywood, Bollywood, Tollywood and movies worldwide.</p>

  <div class="search">
   <input id="searchInput" placeholder="Search any movie...">
   <button onclick="searchMovies()">Search</button>
  </div>
 </div>

 <section>
  <h2 id="sectionTitle">Popular Movies</h2>
  <p class="status" id="status">Loading movies...</p>
  <div class="movies" id="movieList"></div>
 </section>

</div>

<div id="detailsPage">
 <section>

  <button class="back-button" onclick="goBack()">← Back</button>

  <img id="backdrop" class="backdrop" alt="Movie backdrop">

  <h1 class="details-title" id="detailTitle"></h1>
  <p class="details-meta" id="detailMeta"></p>

  <div id="detailGenres"></div>

  <div class="info-grid">
   <div class="info-box">
    <small>Director</small>
    <strong id="director">Unknown</strong>
   </div>

   <div class="info-box">
    <small>Runtime</small>
    <strong id="runtime">Unknown</strong>
   </div>

   <div class="info-box">
    <small>Language</small>
    <strong id="language">Unknown</strong>
   </div>

   <div class="info-box">
    <small>Status</small>
    <strong id="movieStatus">Unknown</strong>
   </div>
  </div>

  <h3>Overview</h3>
  <p class="overview" id="detailOverview"></p>

  <h3>Main Cast</h3>
  <div class="cast-grid" id="castList"></div>

  <h3>Official Trailer</h3>
  <div id="trailerContainer"></div>

 </section>
</div>

<script>
const list = document.getElementById("movieList");
const statusText = document.getElementById("status");
const homePage = document.getElementById("homePage");
const detailsPage = document.getElementById("detailsPage");

async function loadMovies(query = "") {
 statusText.textContent = "Loading movies...";
 list.replaceChildren();

 try {
  const endpoint = query
   ? `/api/movies?query=${encodeURIComponent(query)}`
   : "/api/movies";

  const response = await fetch(endpoint);
  if (!response.ok) throw new Error("Movie search failed");

  const data = await response.json();

  if (!data.results || data.results.length === 0) {
   statusText.textContent = "No movies found.";
   return;
  }

  statusText.textContent = "";

  data.results.forEach(movie => {
   const card = document.createElement("div");
   card.className = "movie";

   const poster = document.createElement("img");
   poster.className = "poster";
   poster.alt = movie.title || "Movie poster";
   poster.src = movie.poster_path
    ? `https://image.tmdb.org/t/p/w500${movie.poster_path}`
    : "";

   const info = document.createElement("div");
   info.className = "movie-info";

   const title = document.createElement("h3");
   title.textContent = movie.title || "Untitled";

   const rating = document.createElement("p");
   rating.textContent =
    `⭐ ${Number(movie.vote_average || 0).toFixed(1)}/10`;

   info.append(title, rating);
   card.append(poster, info);

   card.addEventListener("click", () => showDetails(movie.id));
   list.appendChild(card);
  });

 } catch (error) {
  statusText.textContent =
   "Unable to load movies. Please try again.";
  console.error(error);
 }
}

async function showDetails(id) {
 homePage.style.display = "none";
 detailsPage.style.display = "block";
 window.scrollTo(0, 0);

 const title = document.getElementById("detailTitle");
 const meta = document.getElementById("detailMeta");
 const overview = document.getElementById("detailOverview");
 const backdrop = document.getElementById("backdrop");
 const genres = document.getElementById("detailGenres");
 const castList = document.getElementById("castList");
 const trailerContainer =
  document.getElementById("trailerContainer");

 title.textContent = "Loading...";
 meta.textContent = "";
 overview.textContent = "";
 genres.replaceChildren();
 castList.replaceChildren();
 trailerContainer.replaceChildren();
 backdrop.style.display = "none";

 try {
  const response = await fetch(`/api/movies?id=${id}`);
  if (!response.ok) throw new Error("Details unavailable");

  const movie = await response.json();

  title.textContent = movie.title || "Unknown title";

  meta.textContent =
   `⭐ ${Number(movie.vote_average || 0).toFixed(1)}/10` +
   ` | Release: ${movie.release_date || "Unknown"}`;

  overview.textContent =
   movie.overview || "No overview available.";

  if (movie.backdrop_path) {
   backdrop.src =
    `https://image.tmdb.org/t/p/w1280${movie.backdrop_path}`;
   backdrop.style.display = "block";
  }

  (movie.genres || []).forEach(genre => {
   const tag = document.createElement("span");
   tag.className = "genre";
   tag.textContent = genre.name;
   genres.appendChild(tag);
  });

  const director = (movie.credits?.crew || [])
   .find(person => person.job === "Director");

  document.getElementById("director").textContent =
   director?.name || "Unknown";

  document.getElementById("runtime").textContent =
   movie.runtime ? `${movie.runtime} minutes` : "Unknown";

  document.getElementById("language").textContent =
   movie.original_language?.toUpperCase() || "Unknown";

  document.getElementById("movieStatus").textContent =
   movie.status || "Unknown";

  (movie.credits?.cast || []).slice(0, 12).forEach(person => {
   const card = document.createElement("div");
   card.className = "cast-card";

   const photo = document.createElement("img");
   photo.alt = person.name || "Cast member";
   photo.loading = "lazy";
   photo.src = person.profile_path
    ? `https://image.tmdb.org/t/p/w185${person.profile_path}`
    : "";

   const name = document.createElement("p");
   name.textContent = person.name || "Unknown";

   const character = document.createElement("p");
   character.textContent = person.character || "";

   card.append(photo, name, character);
   castList.appendChild(card);
  });

  const trailer = (movie.videos?.results || []).find(video =>
   video.site === "YouTube" &&
   video.type === "Trailer" &&
   video.key
  );

  if (trailer) {
   const frame = document.createElement("iframe");
   frame.className = "trailer";
   frame.src =
    `https://www.youtube-nocookie.com/embed/${encodeURIComponent(trailer.key)}`;
   frame.title = "Movie trailer";
   frame.allowFullscreen = true;
   frame.referrerPolicy = "strict-origin-when-cross-origin";
   trailerContainer.appendChild(frame);
  } else {
   trailerContainer.textContent = "No trailer available.";
  }

 } catch (error) {
  title.textContent = "Unable to load movie details.";
  console.error(error);
 }
}

function searchMovies() {
 const query =
  document.getElementById("searchInput").value.trim();

 if (!query) {
  document.getElementById("sectionTitle").textContent =
   "Popular Movies";
  loadMovies();
  return;
 }

 document.getElementById("sectionTitle").textContent =
  `Search results for "${query}"`;

 loadMovies(query);
}

function goBack() {
 detailsPage.style.display = "none";
 homePage.style.display = "block";
 window.scrollTo(0, 0);
}

document.getElementById("searchInput")
 .addEventListener("keydown", event => {
  if (event.key === "Enter") searchMovies();
 });

loadMovies();
</script>

</body>
</html>
