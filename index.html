
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MOVIETOK | Discover Movies</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #101014;
  color: white;
  font-family: Arial, sans-serif;
}

header {
  padding: 20px;
  background: #191920;
  text-align: center;
  border-bottom: 2px solid #ff3155;
}

.logo {
  color: #ff3155;
  font-size: 30px;
  font-weight: bold;
  letter-spacing: 2px;
}

header p {
  color: #aaa;
  margin-bottom: 0;
}

main {
  max-width: 1200px;
  margin: auto;
  padding: 20px;
}

h2 {
  margin-top: 28px;
}

.search {
  display: flex;
  margin: 25px 0;
}

.search input {
  flex: 1;
  min-width: 0;
  padding: 14px;
  background: #24242d;
  border: 1px solid #444;
  color: white;
  font-size: 16px;
  border-radius: 8px 0 0 8px;
  outline: none;
}

.search button {
  background: #ff3155;
  color: white;
  border: none;
  padding: 14px 20px;
  cursor: pointer;
  font-weight: bold;
  border-radius: 0 8px 8px 0;
}

.genre-buttons {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  margin: 15px 0 25px;
}

.genre-buttons button {
  background: #292933;
  color: white;
  border: 1px solid #ff3155;
  border-radius: 20px;
  padding: 10px 16px;
  cursor: pointer;
}

.genre-buttons button:hover {
  background: #ff3155;
}

.movies {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
  gap: 20px;
}

.movie-card {
  background: #1c1c24;
  border-radius: 10px;
  overflow: hidden;
  cursor: pointer;
  transition: transform 0.2s;
}

.movie-card:hover {
  transform: translateY(-5px);
}

.movie-card img {
  width: 100%;
  display: block;
  aspect-ratio: 2 / 3;
  object-fit: cover;
  background: #292933;
}

.movie-info {
  padding: 12px;
}

.movie-info h3 {
  font-size: 15px;
  margin: 0 0 8px;
}

.rating {
  color: #ffd166;
  font-size: 13px;
}

.media-type {
  color: #ff8299;
  font-size: 12px;
  margin-top: 7px;
}

.status {
  color: #aaa;
}

.details {
  display: none;
  background: #1c1c24;
  padding: 20px;
  border-radius: 12px;
  margin-top: 20px;
}

.details img {
  width: 180px;
  max-width: 100%;
  border-radius: 10px;
}

.detail-top {
  display: flex;
  flex-wrap: wrap;
  gap: 20px;
}

.detail-text {
  flex: 1;
  min-width: 200px;
}

.details h2 {
  margin-top: 0;
  color: #ff526f;
}

.details p {
  color: #ccc;
  line-height: 1.6;
}

.back-button {
  background: #ff3155;
  color: white;
  border: none;
  padding: 10px 16px;
  border-radius: 6px;
  cursor: pointer;
  margin-bottom: 20px;
}

.trailer {
  width: 100%;
  max-width: 700px;
  aspect-ratio: 16 / 9;
  border: none;
  border-radius: 10px;
}

.cast-list {
  color: #ccc;
  line-height: 1.8;
}

@media (max-width: 500px) {
  main {
    padding: 14px;
  }

  .movies {
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 12px;
  }

  .search button {
    padding: 12px;
  }
}
</style>
</head>

<body>

<header>
  <div class="logo">MOVIETOK</div>
  <p>Discover your next movie or TV show</p>
</header>

<main>

  <div class="search">
    <input
      id="searchInput"
      type="text"
      placeholder="Search movies or TV series..."
    >
    <button onclick="searchMovies()">Search</button>
  </div>

  <section>
    <h2>Browse by Genre</h2>

    <div class="genre-buttons">
      <button onclick="searchGenre('Action', 28, 10759)">Action</button>
      <button onclick="searchGenre('Comedy', 35, 35)">Comedy</button>
      <button onclick="searchGenre('Romance', 10749, '')">Romance</button>
      <button onclick="searchGenre('Horror', 27, '')">Horror</button>
      <button onclick="searchGenre('Thriller', 53, '')">Thriller</button>
      <button onclick="searchGenre('Sci-Fi', 878, 10765)">Sci-Fi</button>
      <button onclick="searchGenre('Animation', 16, 16)">Animation</button>
      <button onclick="searchGenre('Drama', 18, 18)">Drama</button>
    </div>
  </section>

  <section>
    <h2 id="sectionTitle">Popular Movies & TV Shows</h2>
    <p class="status" id="status">Loading...</p>
    <div class="movies" id="movieList"></div>
  </section>

  <section class="details" id="details"></section>

</main>

<script>
const API = "/api/movies";

const movieList = document.getElementById("movieList");
const statusText = document.getElementById("status");
const sectionTitle = document.getElementById("sectionTitle");
const detailsBox = document.getElementById("details");
const searchInput = document.getElementById("searchInput");

function getTitle(item) {
  return item.title || item.name || "Untitled";
}

function getDate(item) {
  return item.release_date || item.first_air_date || "";
}

function getImage(path) {
  return path
    ? `https://image.tmdb.org/t/p/w500${path}`
    : "https://placehold.co/500x750/20202a/ffffff?text=No+Poster";
}

async function loadMovies(url, title) {
  movieList.innerHTML = "";
  detailsBox.style.display = "none";
  statusText.textContent = "Loading...";
  sectionTitle.textContent = title;

  try {
    const response = await fetch(url);

    if (!response.ok) {
      throw new Error("Could not load results.");
    }

    const data = await response.json();
    const results = data.results || [];

    if (!results.length) {
      statusText.textContent = "No results found. Try another search.";
      return;
    }

    statusText.textContent = `${results.length} results found`;

    results.forEach(item => {
      const type = item.media_type ||
        (item.first_air_date ? "tv" : "movie");

      const card = document.createElement("div");
      card.className = "movie-card";

      const image = document.createElement("img");
      image.src = getImage(item.poster_path);
      image.alt = getTitle(item);
      image.loading = "lazy";

      const info = document.createElement("div");
      info.className = "movie-info";

      const name = document.createElement("h3");
      name.textContent = getTitle(item);

      const rating = document.createElement("div");
      rating.className = "rating";
      rating.textContent = `★ ${Number(item.vote_average || 0).toFixed(1)} / 10`;

      const media = document.createElement("div");
      media.className = "media-type";
      media.textContent = type === "tv" ? "TV SERIES" : "MOVIE";

      info.append(name, rating, media);
      card.append(image, info);

      card.addEventListener("click", () => {
        showDetails(item.id, type);
      });

      movieList.appendChild(card);
    });

  } catch (error) {
    statusText.textContent = "Something went wrong. Please try again.";
    console.error(error);
  }
}

function searchMovies() {
  const query = searchInput.value.trim();

  if (!query) {
    statusText.textContent = "Please enter a movie or TV series name.";
    return;
  }

  loadMovies(
    `${API}?query=${encodeURIComponent(query)}`,
    `Search results for: ${query}`
  );
}

function searchGenre(name, movieGenre, tvGenre) {
  const params = new URLSearchParams();

  if (movieGenre) {
    params.set("movieGenre", movieGenre);
  }

  if (tvGenre) {
    params.set("tvGenre", tvGenre);
  }

  searchInput.value = "";

  loadMovies(
    `${API}?${params.toString()}`,
    `${name} Movies & TV Shows`
  );
}

async function showDetails(id, type) {
  detailsBox.style.display = "block";
  detailsBox.innerHTML = "<p>Loading details...</p>";

  detailsBox.scrollIntoView({ behavior: "smooth" });

  try {
    const response = await fetch(
      `${API}?id=${encodeURIComponent(id)}&type=${encodeURIComponent(type)}`
    );

    if (!response.ok) {
      throw new Error("Could not load details.");
    }

    const item = await response.json();

    const title = getTitle(item);
    const overview = item.overview || "No description available.";
    const date = getDate(item) || "Unknown";
    const rating = Number(item.vote_average || 0).toFixed(1);
    const genres = (item.genres || [])
      .map(genre => genre.name)
      .join(", ") || "Not available";

    const isTV = type === "tv";

    const runtime = isTV
      ? (item.episode_run_time || []).join(", ")
      : item.runtime;

    const cast = item.credits?.cast || [];
    const castNames = cast
      .slice(0, 10)
      .map(person => person.name)
      .join(", ");

    const crew = item.credits?.crew || [];

    const director = isTV
      ? (item.created_by || []).map(person => person.name).join(", ")
      : crew
          .filter(person => person.job === "Director")
          .map(person => person.name)
          .join(", ");

    const trailer = (item.videos?.results || []).find(video =>
      video.site === "YouTube" &&
      (video.type === "Trailer" || video.type === "Teaser")
    );

    detailsBox.innerHTML = `
      <button class="back-button" onclick="goBack()">← Back to results</button>

      <div class="detail-top">
        <img src="${getImage(item.poster_path)}" alt="Poster">

        <div class="detail-text">
          <h2>${escapeHTML(title)}</h2>

          <p>★ ${rating} / 10</p>
          <p><strong>Type:</strong> ${isTV ? "TV Series" : "Movie"}</p>
          <p><strong>Release:</strong> ${escapeHTML(date)}</p>
          <p><strong>Genres:</strong> ${escapeHTML(genres)}</p>
          <p><strong>${isTV ? "Creators" : "Director"}:</strong> ${escapeHTML(director || "Not available")}</p>
          <p><strong>${isTV ? "Episode runtime" : "Runtime"}:</strong> ${runtime ? escapeHTML(String(runtime)) + " minutes" : "Not available"}</p>

          ${isTV ? `
            <p><strong>Seasons:</strong> ${item.number_of_seasons ?? "Not available"}</p>
            <p><strong>Episodes:</strong> ${item.number_of_episodes ?? "Not available"}</p>
            <p><strong>Status:</strong> ${escapeHTML(item.status || "Not available")}</p>
          ` : ""}
        </div>
      </div>

      <h3>Overview</h3>
      <p>${escapeHTML(overview)}</p>

      <h3>Cast</h3>
      <p class="cast-list">${escapeHTML(castNames || "Cast information unavailable.")}</p>

      ${trailer ? `
        <h3>Trailer</h3>
        <iframe
          class="trailer"
          src="https://www.youtube-nocookie.com/embed/${encodeURIComponent(trailer.key)}"
          title="YouTube trailer"
          allowfullscreen
          loading="lazy">
        </iframe>
      ` : "<p>No trailer available.</p>"}
    `;

  } catch (error) {
    detailsBox.innerHTML =
      '<p>Unable to load details. Please try again.</p>';
    console.error(error);
  }
}

function escapeHTML(value) {
  return String(value).replace(/[&<>"']/g, character => ({
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    '"': "&quot;",
    "'": "&#39;"
  })[character]);
}

function goBack() {
  detailsBox.style.display = "none";
  detailsBox.innerHTML = "";
  window.scrollTo({ top: 0, behavior: "smooth" });
}

searchInput.addEventListener("keydown", event => {
  if (event.key === "Enter") {
    searchMovies();
  }
});

loadMovies(API, "Popular Movies & TV Shows");
</script>

</body>
</html>
