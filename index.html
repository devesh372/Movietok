
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MOVIETOK | Discover Movies</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0d0d12;color:white;font-family:Arial,sans-serif}
header{padding:20px;background:#17171f;display:flex;justify-content:space-between}
.logo{color:#ff3155;font-size:27px;font-weight:bold}
.hero{padding:45px 20px;text-align:center;background:linear-gradient(120deg,#46142c,#171727)}
.search{display:flex;max-width:500px;margin:25px auto}
input{flex:1;min-width:0;padding:14px;border:0;border-radius:8px 0 0 8px}
button{padding:12px;background:#ff3155;color:white;border:0;border-radius:5px}
.search button{border-radius:0 8px 8px 0}
section{padding:20px}
.movies{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:15px}
.movie{background:#1c1c25;border-radius:10px;overflow:hidden}
.poster{width:100%;display:block;aspect-ratio:2/3;object-fit:cover}
.movie-info{padding:12px}
.movie h3{font-size:16px;margin:0 0 8px}
.movie p{color:#ffc44d;font-size:13px}
.status{color:#aaa}
@media(min-width:700px){.movies{grid-template-columns:repeat(4,minmax(0,1fr))}}
</style>
</head>
<body>
<header>
<div class="logo">MOVIETOK</div>
<div>🎬 Discover</div>
</header>

<div class="hero">
<h1>Discover Your Next Movie.</h1>
<p>Find your next favourite story.</p>
<div class="search">
<input id="searchInput" placeholder="Search movies...">
<button onclick="searchMovies()">Search</button>
</div>
</div>

<section>
<h2>Popular Movies</h2>
<p class="status" id="status">Loading movies...</p>
<div class="movies" id="movieList"></div>
</section>

<script>
const list = document.getElementById("movieList");
const statusText = document.getElementById("status");

async function loadMovies(query = "") {
 statusText.textContent = "Loading movies...";
 list.innerHTML = "";

 try {
  const endpoint = query
   ? `/api/movies?query=${encodeURIComponent(query)}`
   : "/api/movies";

  const response = await fetch(endpoint);
  if (!response.ok) throw new Error("API request failed");

  const data = await response.json();

  if (!data.results || data.results.length === 0) {
   statusText.textContent = "No movies found.";
   return;
  }

  statusText.textContent = "";

  data.results.forEach(movie => {
   const card = document.createElement("div");
   card.className = "movie";

   const poster = movie.poster_path
    ? `https://image.tmdb.org/t/p/w500${movie.poster_path}`
    : "";

   card.innerHTML = `
    ${poster
      ? `<img class="poster" src="${poster}" alt="Movie poster">`
      : `<div class="poster">🎬</div>`}
    <div class="movie-info">
      <h3></h3>
      <p>⭐ ${Number(movie.vote_average || 0).toFixed(1)}/10</p>
    </div>
   `;

   card.querySelector("h3").textContent = movie.title;
   list.appendChild(card);
  });

 } catch (error) {
  statusText.textContent = "Unable to load movies. Please try again.";
  console.error(error);
 }
}

function searchMovies() {
 const query = document.getElementById("searchInput").value.trim();
 loadMovies(query);
}

document.getElementById("searchInput").addEventListener("keydown", event => {
 if (event.key === "Enter") searchMovies();
});

loadMovies();
</script>
</body>
</html>
