
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MOVIETOK | Admin</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 25px;
      background: #101010;
      color: white;
      font-family: Arial, sans-serif;
    }

    .container {
      max-width: 500px;
      margin: 50px auto;
      background: #1c1c1c;
      padding: 25px;
      border-radius: 15px;
    }

    h1 {
      text-align: center;
      color: #e50914;
    }

    input, textarea, button {
      width: 100%;
      padding: 13px;
      margin: 10px 0;
      border: none;
      border-radius: 7px;
      font-size: 16px;
    }

    button {
      background: #e50914;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    #uploadPanel {
      display: none;
    }

    #status {
      overflow-wrap: anywhere;
      line-height: 1.5;
    }

    video {
      width: 100%;
      margin-top: 15px;
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>MOVIETOK ADMIN</h1>

    <section id="loginPanel">
      <h3>Admin Login</h3>

      <input
        type="password"
        id="password"
        placeholder="Enter admin password"
        autocomplete="current-password"
      >

      <button id="loginButton" onclick="adminLogin()">
        Login
      </button>
    </section>

    <section id="uploadPanel">
      <h3>Upload a Movie</h3>

      <input
        type="text"
        id="movieTitle"
        placeholder="Movie title"
        required
      >

      <textarea
        id="movieDescription"
        placeholder="Movie description"
        rows="3"
      ></textarea>

      <input
        type="file"
        id="movieFile"
        accept="video/*"
      >

      <button id="uploadButton" onclick="uploadMovie()">
        Upload Video
      </button>
    </section>

    <p id="status" role="status"></p>
    <div id="preview"></div>
  </div>

  <script>
    async function adminLogin() {
      const button = document.getElementById("loginButton");
      const password = document.getElementById("password");
      const status = document.getElementById("status");

      button.disabled = true;
      status.textContent = "Checking login...";

      try {
        const response = await fetch("/api/login", {
          method: "POST",
          credentials: "same-origin",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            password: password.value
          })
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.error || "Login failed");
        }

        document.getElementById("loginPanel").style.display = "none";
        document.getElementById("uploadPanel").style.display = "block";
        status.textContent = "Admin login successful!";
      } catch (error) {
        status.textContent = error.message;
      } finally {
        button.disabled = false;
      }
    }

    async function uploadMovie() {
      const title = document.getElementById("movieTitle").value.trim();
      const description = document.getElementById("movieDescription").value.trim();
      const file = document.getElementById("movieFile").files[0];
      const button = document.getElementById("uploadButton");
      const status = document.getElementById("status");
      const preview = document.getElementById("preview");

      if (!title || !file) {
        status.textContent = "Enter a title and select a video.";
        return;
      }

      if (file.size === 0 || file.type.indexOf("video/") !== 0) {
        status.textContent = "Please select a valid video file.";
        return;
      }

      button.disabled = true;
      preview.replaceChildren();
      status.textContent = "Preparing secure upload...";

      try {
        const signResponse = await fetch("/api/upload", {
          method: "POST",
          credentials: "same-origin"
        });

        const signData = await signResponse.json();

        if (!signResponse.ok) {
          throw new Error(signData.error || "Upload authorization failed");
        }

        const formData = new FormData();
        formData.append("file", file);
        formData.append("api_key", signData.apiKey);
        formData.append("timestamp", signData.timestamp);
        formData.append("folder", signData.folder);
        formData.append("signature", signData.signature);

        status.textContent = "Uploading video to Cloudinary...";

        const cloudResponse = await fetch(
          `https://api.cloudinary.com/v1_1/${encodeURIComponent(signData.cloudName)}/video/upload`,
          {
            method: "POST",
            body: formData
          }
        );

        const cloudData = await cloudResponse.json();

        if (!cloudResponse.ok) {
          throw new Error(cloudData.error?.message || "Cloudinary upload failed");
        }

        status.textContent = "Video uploaded successfully!";

        const video = document.createElement("video");
        video.controls = true;
        video.src = cloudData.secure_url;
        preview.appendChild(video);

        const link = document.createElement("a");
        link.href = cloudData.secure_url;
        link.textContent = "Open uploaded video";
        link.target = "_blank";
        link.rel = "noopener noreferrer";
        preview.appendChild(link);

        const details = document.createElement("p");
        details.textContent =
          "Title: " + title +
          " | Description: " + description +
          " | Cloudinary ID: " + cloudData.public_id;

        preview.appendChild(details);

        document.getElementById("movieFile").value = "";
      } catch (error) {
        status.textContent = error.message;
      } finally {
        button.disabled = false;
      }
    }
  </script>
</body>
</html>
